<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>港股打新预测 · 设置</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #0b1b34;
      background: #f4f6fb;
    }
    h1 { font-size: 15px; margin: 0 0 4px; color: #0b1b34; }
    .sub { font-size: 11px; color: #6b7a90; margin-bottom: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
    .row label { font-size: 13px; }
    .row input[type="number"] { width: 90px; padding: 4px 6px; border: 1px solid #cdd6e4; border-radius: 6px; }
    .row input[type="date"] { padding: 4px 6px; border: 1px solid #cdd6e4; border-radius: 6px; }
    .row input[type="checkbox"] { width: 18px; height: 18px; }
    .note { font-size: 11px; color: #6b7a90; line-height: 1.5; margin-top: 12px; border-top: 1px solid #dde4ef; padding-top: 10px; }
    .btn { width: 100%; margin-top: 12px; background: #0b1b34; color: #f5b64a; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn.ghost { background: #fff; color: #c0392b; border: 1px solid #e8c2bd; font-weight: 600; margin-top: 6px; padding: 8px; }
    .btn.ghost:disabled { color: #b9c3d1; border-color: #e2e8f0; cursor: not-allowed; }
    .ov-badge { font-size: 12px; color: #98a4b3; }
    .ov-badge.has { color: #185fa5; font-weight: 700; }
    .ver { font-size: 11px; color: #98a4b3; }
    /* v0.6.0：数据更新与反馈入口 */
    .sec { margin-top: 14px; border-top: 1px solid #dde4ef; padding-top: 10px; }
    .btn.soft { background: #fff; color: #185fa5; border: 1px solid #c3d6ea; font-weight: 600; margin-top: 8px; padding: 8px; }
    .btn.soft:hover { background: #f0f6fc; }
    .hint { font-size: 11px; color: #6b7a90; line-height: 1.5; margin-top: 6px; }
    .hint.ok { color: #1a7f4b; }
    .hint.bad { color: #c0392b; }
    /* v0.6.2：代码版本落后提醒（数据能自更新、代码不能，必须显式告知） */
    .hint.warn {
      color: #8a5a00; background: #fff8e6; border: 1px solid #f0dcae;
      border-radius: 6px; padding: 6px 8px; margin-top: 8px; word-break: break-all;
    }
    .hint.warn a { color: #185fa5; }
  </style>
</head>
<body>
  <h1>港股打新预测 · i668 增强</h1>
  <div class="sub">列表页追加三列预测；详情页「预测工坊」看计算过程并手动改价；暗盘结束后自动切换为站点实测值</div>

  <div class="row">
    <label for="fx">A→H 汇率 (CNY→HKD)</label>
    <input type="number" id="fx" step="0.001" min="0.8" max="1.3" value="1.09" />
  </div>

  <div class="row">
    <label for="live">启用实时大盘行情</label>
    <input type="checkbox" id="live" checked />
  </div>

  <div class="row">
    <label for="sim">模拟日期 (预览用，留空=今天)</label>
    <input type="date" id="sim" />
  </div>

  <button class="btn" id="save">保存设置</button>

  <div class="row" style="margin-top:14px;border-top:1px solid #dde4ef;padding-top:10px">
    <label>人工改价设定</label>
    <span id="ovstat" class="ov-badge">…</span>
  </div>
  <button class="btn ghost" id="clear">清除全部人工改价</button>

  <div class="note" id="status"></div>

  <!-- v0.6.0：数据更新。为什么要这个入口 —— 插件不在商店，代码更新必须重装；
       但因子库与模型参数（90% 的更新）走远程，这里能主动催一次，不必等 6 小时。 -->
  <div class="sec">
    <div class="row" style="margin:0">
      <label>因子库 / 模型参数</label>
      <span id="datav" class="ov-badge">…</span>
    </div>
    <button class="btn soft" id="upd">更新数据</button>
    <button class="btn soft" id="reload" hidden>刷新页面即刻生效</button>
    <div class="hint" id="updmsg">新股与重标定会自动同步，无需重装扩展</div>
    <div class="hint warn" id="codewarn" hidden></div>
  </div>

  <div class="sec">
    <button class="btn soft" id="fb">遇到问题 / 提个建议</button>
    <div class="hint" id="fbmsg">复制诊断信息（版本、浏览器、出错页面），粘贴到微信发我就行</div>
  </div>

  <div class="ver" id="ver">插件版本读取中…</div>

  <script src="popup.js"></script>
</body>
</html>
